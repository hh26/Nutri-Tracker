name: Gemini AI Code Review

on:
  pull_request:
    types: [opened, synchronize] # Runs on new PRs and when new commits are pushed

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Required for the action to post comments
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Gemini Code Review
        uses: sshnaidm/gemini-code-review-action@v2
        with:
          gemini-key: ${{ secrets.GEMINI_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          model: "Gemini-3-Flash"
